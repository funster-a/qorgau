services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qorgau
      POSTGRES_PASSWORD: qorgau
      POSTGRES_DB: qorgau
    ports:
      # 5432/5433 на машинах разработчиков обычно заняты локальными службами
      # PostgreSQL — берём заведомо свободный порт, чтобы стек поднимался с первого раза.
      - "55432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorgau -d qorgau"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # удобно для демо на сцене
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      # Датасорс и дашборд подключаются сами — на защите ничего не кликаем руками.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
